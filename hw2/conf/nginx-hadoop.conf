sub_filter '@DATANODE_1_HOST@:9864' 'localhost:9866';
sub_filter '@DATANODE_1_IP@:9864' 'localhost:9866';
sub_filter 'var dnHost = n.name.split(":")[0];' 'var dnHost = n.infoAddr.split(":")[0];';

